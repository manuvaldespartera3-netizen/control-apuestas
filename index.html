<style>

<body>
<div id="err" hidden></div>
<div id="app"></div>

<script src="firebase-config.js"></script>
<script type="module">
/* ===== PUENTE FIREBASE (módulo): solo conecta con Firebase y expone window.FB. La interfaz vive en otro script. ===== */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js';
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js';

try {
  var app = initializeApp(window.FIREBASE_CONFIG);
  var auth = getAuth(app);
  var db;
  try {
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    db = getFirestore(app);
  }
  window.FB = {
    onAuth: function (cb) { return onAuthStateChanged(auth, cb); },
    signIn: function (email, pw) { return signInWithEmailAndPassword(auth, email, pw); },
    signUp: function (email, pw) { return createUserWithEmailAndPassword(auth, email, pw); },
    reset: function (email) { return sendPasswordResetEmail(auth, email); },
    signOut: function () { return signOut(auth); },
    listen: function (uid, name, cb, errCb) {
      return onSnapshot(collection(db, 'users', uid, name), function (snap) {
        cb(snap.docs.map(function (d) { var o = d.data(); o.id = d.id; return o; }));
      }, errCb);
    },
    newId: function (uid, name) { return doc(collection(db, 'users', uid, name)).id; },
    set: function (uid, name, id, data, merge) { return setDoc(doc(db, 'users', uid, name, id), data, merge ? { merge: true } : {}); },
    update: function (uid, name, id, data) { return updateDoc(doc(db, 'users', uid, name, id), data); },
    del: function (uid, name, id) { return deleteDoc(doc(db, 'users', uid, name, id)); },
    batch: function (uid, ops) {
      var b = writeBatch(db);
      ops.forEach(function (o) {
        var ref = doc(db, 'users', uid, o.col, o.id);
        if (o.type === 'del') b.delete(ref); else b.set(ref, o.data);
      });
      return b.commit();
    }
  };
  window.dispatchEvent(new Event('fb-ready'));
} catch (e) {
  window.__fbError = e;
  window.dispatchEvent(new Event('fb-error'));
}
</script>
<script>
/* ===== LÓGICA PURA (sin DOM, sin Firebase): cálculos de beneficio, yield, drawdown, periodos ===== */
(function (root) {
  var AP = {};
  var MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  AP.MONTHS = MONTHS;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  AP.pad = pad;
  AP.ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  AP.round2 = function (n) { return Math.round((n + 1e-9) * 100) / 100; };
  AP.num = function (s) {
    if (typeof s === 'number') return s;
    s = String(s == null ? '' : s).trim().replace(/\s/g, '').replace(',', '.');
    if (s === '') return NaN;
    var n = Number(s);
    return isNaN(n) ? NaN : n;
  };

  /* Resultado -> múltiplo del importe apostado (misma lógica que las fórmulas de tu Excel) */
  AP.isResolved = function (p) { return p.result === 'ganado' || p.result === 'perdido' || p.result === 'mg' || p.result === 'mp'; };
  AP.factor = function (p) {
    switch (p.result) {
      case 'ganado': return p.odds - 1;
      case 'perdido': return -1;
      case 'mg': return (p.odds - 1) / 2;
      case 'mp': return -0.5;
      default: return 0; // pendiente y nulo
    }
  };
  AP.pu = function (p) { return AP.factor(p) * p.stake; };
  AP.pm = function (p) { return AP.factor(p) * p.amount; };

  AP.chrono = function (list) {
    return list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  };

  /* Estadísticas de un conjunto de picks. bank0 = bank inicial total (para el drawdown relativo). */
  AP.stats = function (picks, bank0) {
    var s = { n: picks.length, resolved: 0, won: 0, lost: 0, voided: 0, pending: 0,
      profitU: 0, profitM: 0, volU: 0, volM: 0, oddsSum: 0, winU: 0, lossU: 0, winM: 0, lossM: 0,
      bestM: 0, worstM: 0, ddM: 0, ddU: 0, ddRel: 0, series: [] };
    var cumM = 0, cumU = 0, peakM = 0, peakU = 0;
    AP.chrono(picks).forEach(function (p) {
      if (p.result === 'nulo') { s.voided++; return; }
      if (!AP.isResolved(p)) { s.pending++; return; }
      var u = AP.pu(p), m = AP.pm(p);
      s.resolved++;
      if (p.result === 'ganado' || p.result === 'mg') { s.won++; s.winU += u; s.winM += m; }
      else { s.lost++; s.lossU += -u; s.lossM += -m; }
      s.volU += p.stake; s.volM += p.amount; s.oddsSum += p.odds;
      s.profitU += u; s.profitM += m;
      if (m > s.bestM) s.bestM = m;
      if (m < s.worstM) s.worstM = m;
      cumM += m; cumU += u;
      if (cumM > peakM) peakM = cumM;
      if (cumU > peakU) peakU = cumU;
      if (peakM - cumM > s.ddM) s.ddM = peakM - cumM;
      if (peakU - cumU > s.ddU) s.ddU = peakU - cumU;
      var base = (bank0 || 0) + peakM;
      if (base > 0 && (peakM - cumM) / base > s.ddRel) s.ddRel = (peakM - cumM) / base;
      s.series.push({ date: p.date, cumM: cumM, cumU: cumU });
    });
    s.yieldU = s.volU > 0 ? s.profitU / s.volU : null;
    s.yieldM = s.volM > 0 ? s.profitM / s.volM : null;
    s.hit = (s.won + s.lost) > 0 ? s.won / (s.won + s.lost) : null;
    s.avgStakeM = s.resolved ? s.volM / s.resolved : null;
    s.avgOdds = s.resolved ? s.oddsSum / s.resolved : null;
    s.avgWinU = s.won ? s.winU / s.won : null;
    s.avgLossU = s.lost ? s.lossU / s.lost : null;
    return s;
  };

  AP.groupBy = function (picks, keyFn, bank0) {
    var map = Object.create(null), order = [];
    picks.forEach(function (p) {
      var k = keyFn(p);
      if (!(k in map)) { map[k] = []; order.push(k); }
      map[k].push(p);
    });
    return order.map(function (k) { var st = AP.stats(map[k], bank0); st.key = k; return st; });
  };

  /* Periodos: mes / año / todo, con desplazamiento (offset -1 = anterior) */
  AP.periodRange = function (mode, offset, today, day) {
    if (mode === 'dia') {
      var dd = day || AP.ymd(today), q = dd.split('-');
      var lab = Number(q[2]) + ' de ' + MONTHS[Number(q[1]) - 1].toLowerCase() + ' de ' + q[0];
      if (dd === AP.ymd(today)) lab = 'Hoy · ' + lab;
      return { from: dd, to: dd, label: lab };
    }
    if (mode === 'todo') return { from: '0000-00-00', to: '9999-99-99', label: 'Todo el histórico' };
    if (mode === 'ano') {
      var y = today.getFullYear() + offset;
      return { from: y + '-01-01', to: y + '-12-31', label: String(y) };
    }
    var d = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    var yy = d.getFullYear(), mm = d.getMonth();
    var last = new Date(yy, mm + 1, 0).getDate();
    return { from: yy + '-' + pad(mm + 1) + '-01', to: yy + '-' + pad(mm + 1) + '-' + pad(last), label: MONTHS[mm] + ' ' + yy };
  };
  AP.inRange = function (dateStr, r) { return dateStr >= r.from && dateStr <= r.to; };

  /* Bank actual de una cuenta = bank inicial + ingresos - retiradas + beneficio de apuestas resueltas */
  AP.bankOf = function (acc, picks, movs) {
    var b = acc.bank || 0;
    movs.forEach(function (m) { if (m.accountId === acc.id) b += (m.type === 'ingreso' ? m.amount : -m.amount); });
    picks.forEach(function (p) { if (p.accountId === acc.id) b += AP.pm(p); });
    return b;
  };
  AP.atRisk = function (acc, picks) {
    var t = 0;
    picks.forEach(function (p) { if (p.accountId === acc.id && p.result === 'pendiente') t += p.amount; });
    return t;
  };
  AP.sum = function (list, fn) { var t = 0; list.forEach(function (x) { t += fn(x); }); return t; };

  /* Parseo de cuota: acepta coma o punto */
  AP.parseOdds = function (s) { var n = AP.num(s); return (isNaN(n) || n <= 1) ? NaN : n; };

  root.AP = AP;
  if (typeof module !== 'undefined' && module.exports) module.exports = AP;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== INTERFAZ (script clásico, sin módulos: eventos delegados, sin onclick en línea) ===== */
(function () {
  'use strict';
  var AP = window.AP;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

  /* ---------- formato ---------- */
  function fmtN(n, d) { return Number(n).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function eur(n) { if (n == null || isNaN(n)) return '—'; return fmtN(AP.round2(n), 2) + ' €'; }
  function eurS(n) { if (n == null || isNaN(n)) return '—'; var r = AP.round2(n); return (r > 0 ? '+' : '') + fmtN(r, 2) + ' €'; }

  function loadXlsx(cb) {
    if (window.XLSX) return cb(null);

    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  ACT.exportXlsx = function () {
    toast('Preparando Excel…');
    loadXlsx(function (err) {
      if (err) { toast('No se pudo cargar el exportador. Necesitas conexión.'); return; }
      try { doExport(); toast('Excel descargado'); } catch (e) { showErr(e); }
    });
  };
  function doExport() {
    var X = window.XLSX, wb = X.utils.book_new(), r2 = AP.round2;
    var bank0 = AP.sum(S.accounts, function (a) { return a.bank || 0; });
    function add(name, rows, widths, pctCols, pctByLabel) {
      var ws = X.utils.aoa_to_sheet(rows);
      ws['!cols'] = widths.map(function (w) { return { wch: w }; });
      for (var r = 1; r < rows.length; r++) {
        (pctCols || []).forEach(function (c) { var ref = X.utils.encode_cell({ r: r, c: c }); if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '0.0%'; });
        if (pctByLabel && pctByLabel.test(String(rows[r][0]))) { var rf = X.utils.encode_cell({ r: r, c: 1 }); if (ws[rf] && typeof ws[rf].v === 'number') ws[rf].z = '0.0%'; }
      }
      X.utils.book_append_sheet(wb, ws, name);
    }
    var cumU = 0, cumM = 0;
    var rows = [['Nº', 'Fecha', 'Cuenta', 'Casa', 'Tipster', 'Deporte', 'Evento', 'Mercado', 'Pronóstico', 'Tipo', 'Cuota', 'Stake (u)', 'Importe €', 'Resultado', 'Bº/Pª uds', 'Bº/Pª €', 'Benef. acum. uds', 'Benef. acum. €']];
    AP.chrono(S.picks).forEach(function (p, i) {
      var a = accById(p.accountId), u = AP.pu(p), m = AP.pm(p);
      if (AP.isResolved(p)) { cumU += u; cumM += m; }
      rows.push([i + 1, p.date, a ? a.name : '', a ? (a.bookie || '') : '', p.tipster || '', p.sport || '', p.event || '', p.market || '', p.pick, p.type === 'combo' ? 'Combinada' : 'Simple', p.odds, p.stake, p.amount, RESLBL[p.result] || p.result, r2(u), r2(m), r2(cumU), r2(cumM)]);
    });
    add('PICKS', rows, [5, 11, 16, 14, 16, 16, 22, 16, 30, 11, 8, 9, 11, 12, 11, 11, 15, 15]);

    var st = AP.stats(S.picks, bank0), gastos = AP.sum(S.exps, function (e) { return e.amount; });
    var blank = function (v) { return v == null ? '' : v; };
    rows = [['Concepto', 'Valor'], ['Nº de picks', st.n], ['Ganados', st.won], ['Perdidos', st.lost], ['Nulos', st.voided], ['Pendientes', st.pending], ['% acierto', blank(st.hit)],
      ['Volumen apostado (uds)', r2(st.volU)], ['Volumen apostado €', r2(st.volM)], ['Stake medio €', blank(st.avgStakeM == null ? null : r2(st.avgStakeM))], ['Cuota media', blank(st.avgOdds == null ? null : r2(st.avgOdds))],
      ['Beneficio uds', r2(st.profitU)], ['Yield uds', blank(st.yieldU)], ['Beneficio €', r2(st.profitM)], ['Yield €', blank(st.yieldM)],
      ['Mayor ganancia €', r2(st.bestM)], ['Mayor pérdida €', r2(-st.worstM)], ['Drawdown máx. €', r2(st.ddM)], ['Drawdown máx. uds', r2(st.ddU)], ['Drawdown relativo', st.ddRel],
      ['Gastos totales €', r2(gastos)], ['BENEFICIO REAL €', r2(st.profitM - gastos)]];
    add('RESUMEN', rows, [28, 16], [], /^(% acierto|Yield|Drawdown relativo)/);

    var GH = ['Nombre', 'Picks', 'Ganados', 'Perdidos', 'Nulos', 'Pendientes', 'Vol. uds', 'Bº uds', 'Yield uds', 'Vol. €', 'Bº €', 'Yield €', 'Apuesta media €', 'Cuota media'];
    function grow(s) { return [s.key, s.n, s.won, s.lost, s.voided, s.pending, r2(s.volU), r2(s.profitU), blank(s.yieldU), r2(s.volM), r2(s.profitM), blank(s.yieldM), s.avgStakeM == null ? '' : r2(s.avgStakeM), s.avgOdds == null ? '' : r2(s.avgOdds)]; }
    var gw = [24, 7, 9, 9, 7, 11, 10, 10, 10, 11, 11, 10, 15, 12];
    function groupSheet(name, key, extra) {
      var g = AP.groupBy(S.picks, keyFor(key), bank0).sort(function (a, b) { return b.profitM - a.profitM; });
      var hdr = GH.slice(), costs = null;
      if (extra === 'tipster') { costs = tipsterCosts(S.exps); hdr.push('Gastos €', 'Real €'); Object.keys(costs).forEach(function (t) { if (!g.some(function (r) { return r.key === t; })) { var z = AP.stats([], 0); z.key = t; g.push(z); } }); }
      var out = [hdr];
      g.forEach(function (s) { var r = grow(s); if (costs) { var c = costs[s.key] || 0; r.push(r2(c), r2(s.profitM - c)); } out.push(r); });
      add(name, out, costs ? gw.concat([11, 11]) : gw, [8, 11]);
    }
    groupSheet('TIPSTERS', 'tipster', 'tipster'); groupSheet('MERCADOS', 'mercado'); groupSheet('DEPORTES', 'deporte'); groupSheet('BOOKIES', 'casa'); groupSheet('POR CUENTA', 'cuenta');

    var mg = AP.groupBy(S.picks, keyFor('mes'), bank0), months = Object.create(null), keys = [];
    mg.forEach(function (s) { months[s.key] = s; keys.push(s.key); });
    var gm = Object.create(null);
    S.exps.forEach(function (e) { var k = String(e.date).slice(0, 7); gm[k] = (gm[k] || 0) + e.amount; if (keys.indexOf(k) < 0) keys.push(k); });
    keys.sort();
    rows = [['Mes', 'Picks', 'Vol. uds', 'Bº uds', 'Yield uds', 'Vol. €', 'Bº €', 'Yield €', 'Gastos €', 'Real €']];
    keys.forEach(function (k) {
      var s = months[k] || AP.stats([], 0), g = gm[k] || 0;
      rows.push([AP.MONTHS[Number(k.slice(5, 7)) - 1] + ' ' + k.slice(0, 4), s.n, r2(s.volU), r2(s.profitU), blank(s.yieldU), r2(s.volM), r2(s.profitM), blank(s.yieldM), r2(g), r2(s.profitM - g)]);
    });
    add('MESES', rows, [18, 7, 10, 10, 10, 11, 11, 10, 11, 11], [4, 7]);

    rows = [['Cuenta', 'Casa', 'Bank inicial €', 'Ingresos €', 'Retiradas €', 'Bº apuestas €', 'Bank actual €', '1 unidad €', 'Estado']];
    S.accounts.slice().sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); }).forEach(function (a) {
      var ing = AP.sum(S.movs.filter(function (m) { return m.accountId === a.id && m.type === 'ingreso'; }), function (m) { return m.amount; });
      var ret = AP.sum(S.movs.filter(function (m) { return m.accountId === a.id && m.type === 'retirada'; }), function (m) { return m.amount; });
      var pr = AP.sum(S.picks.filter(function (p) { return p.accountId === a.id; }), function (p) { return AP.pm(p); });
      rows.push([a.name, a.bookie || '', a.bank || 0, r2(ing), r2(ret), r2(pr), r2(AP.bankOf(a, S.picks, S.movs)), a.unit, a.archived ? 'Archivada' : 'Activa']);
    });
    add('CUENTAS', rows, [18, 14, 14, 12, 12, 14, 14, 11, 11]);

    rows = [['Fecha', 'Cuenta', 'Tipo', 'Importe €', 'Nota']];
    S.movs.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (m) { rows.push([m.date, accName(m.accountId), m.type === 'ingreso' ? 'Ingreso' : 'Retirada', m.amount, m.note || '']); });
    add('MOVIMIENTOS', rows, [11, 18, 11, 12, 30]);

    rows = [['Fecha', 'Categoría', 'Tipster', 'Nota', 'Cuenta', 'Importe €']];
    S.exps.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (e) { rows.push([e.date, e.category, e.tipster || '', e.note || '', e.accountId ? accName(e.accountId) : '', e.amount]); });
    add('GASTOS', rows, [11, 16, 18, 28, 16, 11]);

    X.writeFile(wb, 'control-apuestas_' + today() + '.xlsx');
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'closeBg') { if (e.target === el) closeModal(); return; }
    var fn = ACT[act]; if (!fn) return;
    e.preventDefault();
    try { fn(el.getAttribute('data-arg'), el, e); } catch (err) { showErr(err); }
  });
  INPUT['l-email'] = function (v) { S.login.email = v; };
  INPUT['l-pass'] = function (v) { S.login.pass = v; };
  document.addEventListener('input', function (e) {
    var h = INPUT[e.target.id]; if (h) { h(e.target.value, e.target); return; }
    var acc = e.target.getAttribute ? e.target.getAttribute('data-oacc') : null;
    if (acc) { var val = e.target.value.trim(); if (val === '') delete S.form.oddsBy[acc]; else S.form.oddsBy[acc] = val; refreshMultiUI(); }
  });
  document.addEventListener('change', function (e) {
    var h = CHANGE[e.target.id]; if (h) h(e.target.value, e.target);
    var acc = e.target.getAttribute ? e.target.getAttribute('data-oacc') : null;
    if (acc && e.target.value.trim() === '') { e.target.value = S.form.odds; delete S.form.oddsBy[acc]; refreshMultiUI(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'l-pass') { ACT.login(); }
    else if (e.target.id === 'l-email') { var p = $('#l-pass'); if (p) p.focus(); }
  });
  ACT.tab = function (a) { S.tab = a; render(); window.scrollTo(0, 0); };
  ACT.copyErr = function () { try { navigator.clipboard.writeText(errMsg); toast('Error copiado'); } catch (e) {} };
  ACT.closeErr = function () { var el = $('#err'); if (el) el.hidden = true; };
  window.addEventListener('online', soft); window.addEventListener('offline', soft);

  /* ---------- pintar ---------- */
  function render() {
    var app = $('#app'); if (!app) return;
    if (S.fbError) { app.innerHTML = '<div class="login"><section class="card"><h2>No se pudo arrancar</h2><p>' + esc(S.fbError) + '</p></section></div>'; return; }
    if (!S.authReady) { app.innerHTML = '<div class="center mut">Cargando…</div>'; return; }
    if (!S.user) { app.innerHTML = loginView(); return; }
    if (!dataReady()) { app.innerHTML = header() + '<main><div class="center mut">Cargando tus datos…</div></main>' + navHtml(); return; }
    var views = { registrar: viewRegistrar, pendientes: viewPendientes, resumen: viewResumen, gastos: viewGastos, cuentas: viewCuentas };
    app.innerHTML = header() + '<main>' + views[S.tab]() + '</main>' + navHtml();
    if (S.tab === 'registrar') refreshStakeUI();
  }

  function init() {
    var cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || /^PEGA/i.test(cfg.apiKey)) { S.fbError = 'Falta configurar firebase-config.js con los datos de tu proyecto de Firebase.'; render(); return; }
    FB = window.FB;
    FB.onAuth(function (user) {
      S.authReady = true; S.user = user;
      if (user) startData(); else { stopData(); S.login.pass = ''; }
      render();
    });
  }
  render();
  if (window.FB) init();
  else {
    window.addEventListener('fb-ready', init);
    window.addEventListener('fb-error', function () { S.fbError = 'Firebase no ha podido iniciarse: ' + ((window.__fbError && window.__fbError.message) || 'error desconocido'); render(); });
    setTimeout(function () { if (!window.FB && !S.fbError) { S.fbError = 'No se pudo cargar Firebase. Si es la primera vez que abres la app, necesitas conexión.'; render(); } }, 15000);
  }
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  window.__AP_TEST = { S: S, ACT: ACT, render: render, INPUT: INPUT, CHANGE: CHANGE };
})();

</script>
</body>
